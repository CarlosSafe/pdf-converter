<footer th:fragment="footer" id="footer" class="text-center">

  <script type="module" th:src="@{'/js/thirdParty/cookieconsent-config.js'}" th:if="${@analyticsEnabled}"></script>
  <div class="footer-center">
    <!-- Footer links removed - clean footer -->
    <!-- Cookie preferences only if analytics enabled -->
    <div class="d-flex justify-content-center" th:if="${@analyticsEnabled}">
      <ul class="list-unstyled footer-link-list">
        <li><a class="footer-link px-2" id="cookieBanner" target="_blank" th:text="#{legal.showCookieBanner}"
            onClick="CookieConsent.show(true)">Cookie Preferences</a></li>
      </ul>
    </div>
  </div>
</footer>
